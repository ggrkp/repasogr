spring.application.name=repasogr

# File-based H2 database (stored in ./data). Keep SQL portable so PostgreSQL can replace it later.
spring.datasource.url=jdbc:h2:file:./data/wordlists
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# UTF-8 everywhere (Greek and Spanish characters)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8

# Dictionary import (FreeDict/WikDict TEI file). Set this to import at startup, then remove or leave as is.
# Example: mvn spring-boot:run -Dspring-boot.run.arguments=--dictionary.import.tei=data/dictionaries/freedict-ell-spa-2023.05.29.tei
