<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Word lists</title>
</head>
<body>
<div th:replace="~{layout :: navbar}"></div>
<main class="container">
<h1>Word lists</h1>

<p th:if="${message}" th:text="${message}" class="message"></p>
<p th:if="${error}" th:text="${error}" class="error"></p>

<form method="post" th:action="@{/lists}">
    <label>New list name
        <input type="text" name="name" th:value="${name}">
    </label>
    <button type="submit">Create list</button>
</form>

<h2>Combine lists</h2>
<p class="muted">Make a new list with all the words of the lists you tick. A word that is in several of them is kept once.</p>
<form method="post" th:action="@{/lists/combine}" th:unless="${allLists.isEmpty()}">
    <label>New list name
        <input type="text" name="name">
    </label>
    <fieldset>
        <legend>Lists to combine</legend>
        <label th:each="source : ${allLists}" class="checkbox">
            <input type="checkbox" name="sourceIds" th:value="${source.id}">
            <span th:text="${source.name}"></span>
            <span class="muted" th:text="'(' + ${source.items.size()} + ' ' + (${source.items.size() == 1} ? 'word)' : 'words)')"></span>
        </label>
    </fieldset>
    <button type="submit">Create combined list</button>
</form>
<p th:if="${allLists.isEmpty()}">Create at least one list first.</p>

<h2>Your lists</h2>
<form method="get" th:action="@{/lists}" class="inline-form">
    <label>Filter by name
        <input type="text" name="q" th:value="${q}">
    </label>
    <label>Sort by
        <select name="sort">
            <option value="name" th:selected="${sort == 'name'}">Name (A–Z)</option>
            <option value="words" th:selected="${sort == 'words'}">Most words first</option>
        </select>
    </label>
    <button type="submit">Apply</button>
    <a th:if="${!q.isEmpty() or sort != 'name'}" th:href="@{/lists}">Reset</a>
</form>

<p th:if="${lists.isEmpty() and q.isEmpty()}">No lists yet.</p>
<p th:if="${lists.isEmpty() and !q.isEmpty()}">No lists match "<span th:text="${q}"></span>".</p>

<ul>
    <li th:each="wordList : ${lists}">
        <a th:href="@{/lists/{id}(id=${wordList.id})}" th:text="${wordList.name}"></a>
        <span class="muted" th:text="'(' + ${wordList.items.size()} + (${wordList.items.size() == 1} ? ' word)' : ' words)')"></span>
        <form method="post" th:action="@{/lists/{id}/delete(id=${wordList.id})}" style="display:inline"
              th:onsubmit="return confirm('Delete this list and all its words?')">
            <button type="submit">Delete list</button>
        </form>
    </li>
</ul>
</main>
</body>
</html>
